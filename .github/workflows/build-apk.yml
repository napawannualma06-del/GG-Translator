name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Env
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          chmod +x ./gradlew
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameTranslator-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Prepare APK for GitHub Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/GG-Translator.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GG Translator v1.0 (Latest APK)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 GG Translator - Android APK Release

            ดาวน์โหลดไฟล์ APK ไปติดตั้งบนอุปกรณ์ Android ของคุณ:
            - **GG-Translator.apk** (พร้อมติดตั้งทันที)

            ### ✨ คุณสมบัติ:
            - **On-Device OCR + AI Translation**: แปลภาษาเกมแบบเรียลไทม์
            - **Token Saver Mode**: ส่งเฉพาะข้อความ ประหยัด Token สูงสุด
            - **Google Gemini & DeepSeek**: สลับใช้งาน AI สองค่ายได้ตามต้องการ
            - **Model Selector**: ดึงรายชื่อโมเดลล่าสุดมาเลือกใช้ได้ทันที
          files: release-apk/GG-Translator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
